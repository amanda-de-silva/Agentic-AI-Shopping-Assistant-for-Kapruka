[project]
name = "kapruka-ai-concierge"
version = "0.1.0"
description = "Conversational shopping concierge for Kapruka.com"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "qdrant-client>=1.11.0",
    "supabase>=2.7.0",
    "langfuse>=2.44.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.9",
    "tenacity>=9.0.0",
    "orjson>=3.10.7",
    "sse-starlette>=2.1.3",
    "psycopg[binary]>=3.2.0",
    "fastembed>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
    "respx>=0.21.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008: FastAPI's Depends(...) in a default argument is the documented, intended
# pattern -- not the "mutable default" foot-gun this rule exists to catch.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"